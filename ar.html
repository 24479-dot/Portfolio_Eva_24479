<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Experiência AR | Eva Guedelha</title>

    <link rel="stylesheet" href="ar.css">

    <!-- A-Frame -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script src="ar.js" defer></script>

</head>

<body>

    <!-- Interface -->

    <div class="interface">

        <a href="index.html" class="botao-voltar">
            Voltar
        </a>

        <p id="mensagem">
            A carregar a experiência...
        </p>

    </div>

    <!-- Experiência AR -->

    <a-scene
        mindar-image="
            imageTargetSrc: ./target/target.mind;
            uiScanning: no;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Câmara -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- Target -->

        <a-entity
            id="target-portfolio"
            mindar-image-target="targetIndex: 0">

            <!-- Animação -->

            <a-plane
                id="animacao"
                position="0 0 0.05"
                width="1.8"
                height="1"
                material="
                    shader: flat;
                    transparent: true;
                    depthWrite: false;"
                visible="false">

            </a-plane>

        </a-entity>

    </a-scene>

</body>

</html>
